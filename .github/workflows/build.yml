name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            display-name: macOS Arm
            command: ./gradlew --stacktrace --info macosArm64Test jvmTest
            shell: bash
          - os: macos-26-intel
            display-name: macOS Intel
            command: ./gradlew --stacktrace --info macosX64Test jvmTest
            shell: bash
          - os: ubuntu-latest
            display-name: Linux x64
            command: ./gradlew --stacktrace --info linuxX64Test jvmTest
            shell: bash
          - os: ubuntu-24.04-arm
            display-name: Linux Arm64 FoundationDB smoke
            command: |
              set -euo pipefail
              trap 'FDB_CLEAN_MODE=all bash foundationdb/scripts/stop-fdb-for-tests.sh' EXIT
              bash foundationdb/scripts/install-foundationdb.sh
              file foundationdb/bin/fdbserver foundationdb/bin/fdbcli foundationdb/bin/lib/libfdb_c.so | grep -q 'ARM aarch64'
              foundationdb/bin/fdbserver --version
              foundationdb/bin/fdbcli --version
              bash foundationdb/scripts/run-fdb-for-tests.sh
              FDB_CLUSTER_FILE="$PWD/foundationdb/fdb.cluster" foundationdb/bin/fdbcli --exec 'status minimal' | grep -q 'The database is available'
            shell: bash
    name: ${{ matrix.display-name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ${{ matrix.display-name }}
        run: ${{ matrix.command }}
