name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            display-name: macOS Arm
            command: |
              ./gradlew --stacktrace --info checkKotlinAbi allMetadataJar generateMetadataFileForJvmPublication generatePomFileForJvmPublication macosArm64Test jvmTest
              ./gradlew --stacktrace --info '-PfoundationDbNativeTestFilter=maryk.foundationdb.LegacyApiVersionNativeTest.*' macosArm64Test
              ./gradlew --stacktrace --info '-PfoundationDbNativeTestFilter=maryk.foundationdb.LegacyVersionstampApiNativeTest.*' macosArm64Test
              python3 verification/check-external-consumer.py
            shell: bash
          - os: macos-26-intel
            display-name: macOS Intel
            command: ./gradlew --stacktrace --info macosX64Test jvmTest
            shell: bash
          - os: ubuntu-latest
            display-name: Linux x64
            command: ./gradlew --stacktrace --info linuxX64Test jvmTest
            shell: bash
    name: ${{ matrix.display-name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ${{ matrix.display-name }}
        run: ${{ matrix.command }}

  build-linux-arm64-tests:
    name: Cross-compile Linux ARM64 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Extract verified ARM64 link library
        run: bash foundationdb/scripts/prepare-linux-arm64-client.sh
      - name: Cross-compile on supported x64 compiler host
        run: ./gradlew --stacktrace --info -PfoundationDbLinuxArm64LibraryDir="$PWD/build/linux-arm64-client/lib" linkDebugTestLinuxArm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-binding-tests
          path: build/bin/linuxArm64/debugTest/test.kexe
          if-no-files-found: error

  run-linux-arm64-tests:
    name: Linux ARM64 binding runtime tests
    needs: build-linux-arm64-tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-arm64-binding-tests
          path: build/linux-arm64-tests
      - name: Run cross-compiled suite against native ARM64 FoundationDB
        shell: bash
        run: |
          set -euo pipefail
          trap 'FDB_CLEAN_MODE=all bash foundationdb/scripts/stop-fdb-for-tests.sh' EXIT
          bash foundationdb/scripts/install-foundationdb.sh
          file foundationdb/bin/fdbserver foundationdb/bin/fdbcli foundationdb/bin/lib/libfdb_c.so | grep -q 'ARM aarch64'
          bash foundationdb/scripts/run-fdb-for-tests.sh
          export FDB_CLUSTER_FILE="$PWD/foundationdb/fdb.cluster"
          export LD_LIBRARY_PATH="$PWD/foundationdb/bin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          chmod +x build/linux-arm64-tests/test.kexe
          build/linux-arm64-tests/test.kexe --ktest_logger=SIMPLE '--ktest_filter=*-maryk.foundationdb.LegacyApiVersionNativeTest.*:maryk.foundationdb.LegacyVersionstampApiNativeTest.*:maryk.foundationdb.MetricsBenchmarkNativeTest.*'
          build/linux-arm64-tests/test.kexe --ktest_logger=SIMPLE '--ktest_filter=maryk.foundationdb.LegacyApiVersionNativeTest.*'
          build/linux-arm64-tests/test.kexe --ktest_logger=SIMPLE '--ktest_filter=maryk.foundationdb.LegacyVersionstampApiNativeTest.*'
