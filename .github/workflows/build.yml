name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            display-name: macOS Arm
            command: |
              ./gradlew --stacktrace --info checkKotlinAbi allMetadataJar generateMetadataFileForJvmPublication generatePomFileForJvmPublication macosArm64Test jvmTest
              ./gradlew --stacktrace --info '-PfoundationDbJvmTestFilter=maryk.foundationdb.LegacyApiVersionTest.*' jvmTest
              ./gradlew --stacktrace --info '-PfoundationDbNativeTestFilter=maryk.foundationdb.LegacyApiVersionTest.*' macosArm64Test
              ./gradlew --stacktrace --info '-PfoundationDbJvmTestFilter=maryk.foundationdb.LegacyVersionstampApiTest.*' jvmTest
              ./gradlew --stacktrace --info '-PfoundationDbNativeTestFilter=maryk.foundationdb.LegacyVersionstampApiTest.*' macosArm64Test
              ./gradlew --stacktrace --info checkExternalConsumer
            shell: bash
          - os: macos-26-intel
            display-name: macOS Intel
            command: ./gradlew --stacktrace --info macosX64Test jvmTest
            shell: bash
          - os: ubuntu-latest
            display-name: Linux x64
            command: ./gradlew --stacktrace --info linuxX64Test jvmTest
            shell: bash
    name: ${{ matrix.display-name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run ${{ matrix.display-name }}
        run: ${{ matrix.command }}

  build-linux-arm64-tests:
    name: Cross-compile Linux ARM64 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Extract verified ARM64 link library
        run: bash foundationdb/scripts/prepare-linux-arm64-client.sh
      - name: Cross-compile on supported x64 compiler host
        run: ./gradlew --stacktrace --info -PfoundationDbLinuxArm64LibraryDir="$PWD/build/linux-arm64-client/lib" linkDebugTestLinuxArm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-binding-tests
          path: build/bin/linuxArm64/debugTest/test.kexe
          if-no-files-found: error

  run-linux-arm64-tests:
    name: Linux ARM64 binding runtime tests
    needs: build-linux-arm64-tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-binding-tests
          path: build/linux-arm64-tests
      - name: Run cross-compiled suite against native ARM64 FoundationDB
        shell: bash
        run: |
          set -euo pipefail
          trap 'FDB_CLEAN_MODE=all bash foundationdb/scripts/stop-fdb-for-tests.sh' EXIT
          bash foundationdb/scripts/install-foundationdb.sh
          file foundationdb/bin/fdbserver foundationdb/bin/fdbcli foundationdb/bin/lib/libfdb_c.so | grep -q 'ARM aarch64'
          bash foundationdb/scripts/run-fdb-for-tests.sh
          export FDB_CLUSTER_FILE="$PWD/foundationdb/fdb.cluster"
          export LD_LIBRARY_PATH="$PWD/foundationdb/bin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          chmod +x build/linux-arm64-tests/test.kexe
          build/linux-arm64-tests/test.kexe --ktest_logger=SIMPLE '--ktest_filter=*-maryk.foundationdb.LegacyApiVersionTest.*:maryk.foundationdb.LegacyVersionstampApiTest.*:maryk.foundationdb.MetricsBenchmarkNativeTest.*'
          build/linux-arm64-tests/test.kexe --ktest_logger=SIMPLE '--ktest_filter=maryk.foundationdb.LegacyApiVersionTest.*'
          build/linux-arm64-tests/test.kexe --ktest_logger=SIMPLE '--ktest_filter=maryk.foundationdb.LegacyVersionstampApiTest.*'
